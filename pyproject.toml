[project]
name = "gtm-brain"
version = "0.1.0"
description = "Outbound research-to-sequence pipeline with human approval. Claude Code plugin, MCP server and CLI."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "pyyaml",
    "mcp<2",
    "httpx",
    "beautifulsoup4",
]

[project.scripts]
gtm-brain = "gtm_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest"]
